name: Audit health

on:
    schedule:
        - cron: '7,22,37,52 * * * *'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: audit-health
    cancel-in-progress: false

jobs:
    audit-health:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '22.19.0'
            - name: Verify audit collection and retention
              env:
                  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
                  SUPABASE_PROJECT_ID: vllqakohumoinpdwnsqa
              run: node scripts/check-audit-health.js
