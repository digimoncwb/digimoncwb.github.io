name: Auth email configuration

on:
    workflow_dispatch:
        inputs:
            action:
                description: Inspect, prepare, or send one explicitly authorized invitation to the community Gmail
                type: choice
                options: [inspect, prepare, test_invite]
                default: inspect
                required: true
            authorize_test_invite:
                description: Authorize one real invite to digimoncwb@gmail.com (creates a non-admin Auth user)
                type: boolean
                default: false

permissions:
    contents: read

concurrency:
    group: auth-email-config
    cancel-in-progress: false

jobs:
    configure:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '22.19.0'
            - name: Configure auth email without copying credentials
              env:
                  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
                  SUPABASE_PROJECT_ID: vllqakohumoinpdwnsqa
                  EMAIL_CONFIG_ACTION: ${{ inputs.action }}
                  AUTHORIZE_TEST_INVITE: ${{ inputs.authorize_test_invite }}
              run: node scripts/configure-auth-emails.js
