name: Auth email configuration

on:
    workflow_dispatch:
        inputs:
            action:
                description: Inspect public settings or prepare templates and redirects (never sends email)
                type: choice
                options: [inspect, prepare]
                default: inspect
                required: true

permissions:
    contents: read

concurrency:
    group: auth-email-config
    cancel-in-progress: false

jobs:
    configure:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '22.19.0'
            - name: Configure auth email without copying credentials
              env:
                  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
                  SUPABASE_PROJECT_ID: vllqakohumoinpdwnsqa
                  EMAIL_CONFIG_ACTION: ${{ inputs.action }}
              run: node scripts/configure-auth-emails.js
