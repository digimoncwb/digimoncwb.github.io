name: CI

on:
    push:
        branches: [main, master]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    quality:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pages: read
        env:
            TZ: America/Sao_Paulo

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '22.19.0'

            - name: Install dependencies
              run: npm ci --no-audit --no-fund

            - name: Lint
              run: npm run lint

            - name: Tests
              run: npm run test

            - name: Build micro-frontends
              run: npm run build:release

            - name: TypeScript
              run: npm run typecheck

            - name: Frontend artifact
              uses: actions/upload-artifact@v4
              with:
                  name: digimon-cwb-site
                  path: .tmp/site/
                  include-hidden-files: true

            - name: Configure GitHub Pages
              if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
              uses: actions/configure-pages@v5

            - name: Upload GitHub Pages package
              if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
              uses: actions/upload-pages-artifact@v4
              with:
                  path: .tmp/site/

    deploy-pages:
        name: Publish community site
        needs: quality
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        concurrency:
            group: github-pages
            cancel-in-progress: false
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Publish GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4

    deploy-digilab:
        name: Deploy DigiLab functions
        needs: quality
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        concurrency:
            group: deploy-digilab-production
            cancel-in-progress: false
        env:
            SUPABASE_PROJECT_ID: vllqakohumoinpdwnsqa
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Check for DigiLab changes
              id: changes
              env:
                  BEFORE_SHA: ${{ github.event.before }}
                  EVENT_NAME: ${{ github.event_name }}
              shell: bash
              run: |
                  if [[ "$EVENT_NAME" == "workflow_dispatch" || -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]]; then
                    echo "deploy=true" >> "$GITHUB_OUTPUT"
                  elif ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
                    echo "deploy=true" >> "$GITHUB_OUTPUT"
                  elif git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- \
                    .github/workflows/ci.yml \
                    scripts/deploy-digilab-schema.js \
                    scripts/check-site-account-schema.js \
                    database/migrations/20260924010000_reliable_digilab_sync.sql \
                    database/migrations/20261005010000_automate_digilab_catalog.sql \
                    database/migrations/20261005020000_schedule_digilab_catalog.sql \
                    database/migrations/20261005030000_digilab_tournaments_every_six_hours.sql \
                    database/migrations/20261005040000_require_digilab_tournament_format.sql \
                    database/migrations/20261005050000_store_digilab_catalog_images.sql \
                    database/migrations/20261006010000_digilab_tournaments_hourly.sql \
                    database/migrations/20261006020000_card_portrait_settings.sql \
                    supabase/config.toml \
                    supabase/functions/_shared \
                    supabase/functions/digilab-deck-catalog \
                    supabase/functions/import-digilab-tournament \
                    supabase/functions/preview-digilab-import \
                    supabase/functions/sync-new-digilab-tournaments \
                    supabase/functions/verify-digilab-tournament \
                    supabase/functions/digilab-health \
                    supabase/functions/change-admin-password \
                    supabase/functions/upload-card-image \
                    supabase/functions/erase-site-account; then
                    echo "deploy=false" >> "$GITHUB_OUTPUT"
                  else
                    echo "deploy=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Setup Supabase CLI
              if: steps.changes.outputs.deploy == 'true'
              uses: supabase/setup-cli@v1
              with:
                  version: 2.99.0

            - name: Setup Node for schema deployment
              if: steps.changes.outputs.deploy == 'true'
              uses: actions/setup-node@v4
              with:
                  node-version: '22.19.0'

            - name: Apply DigiLab schema
              if: steps.changes.outputs.deploy == 'true'
              env:
                  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
              run: node scripts/deploy-digilab-schema.js

            - name: Deploy DigiLab functions
              if: steps.changes.outputs.deploy == 'true'
              env:
                  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
              shell: bash
              run: |
                  if [[ -z "$SUPABASE_ACCESS_TOKEN" ]]; then
                    echo "::error::Configure the SUPABASE_ACCESS_TOKEN repository secret."
                    exit 1
                  fi
                  node scripts/check-site-account-schema.js
                  supabase functions deploy import-digilab-tournament --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
                  supabase functions deploy preview-digilab-import --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
                  supabase functions deploy sync-new-digilab-tournaments --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
                  supabase functions deploy digilab-deck-catalog --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
                  supabase functions deploy verify-digilab-tournament --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
                  supabase functions deploy digilab-health --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
                  supabase functions deploy change-admin-password --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
                  supabase functions deploy upload-card-image --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
                  supabase functions deploy erase-site-account --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
