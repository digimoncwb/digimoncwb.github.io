<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Decklist Builder - Digimon TCG</title>
        <link rel="icon" type="image/png" href="../../icons/favicon/favicon.png" />
        <link rel="stylesheet" href="../../styles.css?v=2026.07.26.1" />
        <link rel="stylesheet" href="../../styles/components/utilities.css?v=2026.03.27.1" />
        <link rel="stylesheet" href="../../styles/components/states.css?v=2026.03.27.1" />
    </head>
    <body class="decklist-builder-page">
        <div class="container">
            <header class="decklist-builder-header">
                <div class="decklist-builder-header-main">
                    <div class="decklist-builder-header-left">
                        <a href="../../index.html" class="nav-button decklist-builder-back-nav">
                            <span>&larr; Voltar ao DIGIMON CWB</span>
                        </a>
                        <h1>Deck Builder</h1>
                    </div>
                    <div class="decklist-builder-header-actions" aria-label="Deck actions">
                        <div class="decklist-builder-action-grid" role="group" aria-label="Deck actions">
                            <button type="button" id="btnDecklistBuilderClear" class="btn-secondary decklist-builder-action-btn">
                                <span class="decklist-builder-btn-icon" aria-hidden="true">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M3 6h18"></path>
                                        <path d="M8 6V4h8v2"></path>
                                        <path d="M6 6l1 14h10l1-14"></path>
                                        <path d="M10 11v6"></path>
                                        <path d="M14 11v6"></path>
                                    </svg>
                                </span>
                                <span>Limpar</span>
                            </button>
                            <button type="button" id="btnDecklistBuilderImport" class="btn-secondary decklist-builder-action-btn">
                                <span class="decklist-builder-btn-icon" aria-hidden="true">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M12 3v12"></path>
                                        <path d="m7 10 5 5 5-5"></path>
                                        <path d="M5 21h14"></path>
                                    </svg>
                                </span>
                                <span>Importar</span>
                            </button>
                            <button type="button" id="btnDecklistBuilderExport" class="btn-secondary decklist-builder-action-btn">
                                <span class="decklist-builder-btn-icon" aria-hidden="true">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M12 21V9"></path>
                                        <path d="m17 14-5-5-5 5"></path>
                                        <path d="M5 3h14"></path>
                                    </svg>
                                </span>
                                <span>Exportar</span>
                            </button>
                            <button type="button" id="btnDecklistBuilderExportImage" class="btn-secondary decklist-builder-action-btn">
                                <span class="decklist-builder-btn-icon" aria-hidden="true">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                                        <circle cx="8.5" cy="10" r="1.5"></circle>
                                        <path d="m21 15-5-5L5 21"></path>
                                    </svg>
                                </span>
                                <span>Imagem</span>
                            </button>
                            <button type="button" id="btnDecklistBuilderSortCards" class="btn-secondary decklist-builder-action-btn">
                                <span class="decklist-builder-btn-icon" aria-hidden="true">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M3 6h10"></path>
                                        <path d="M3 12h7"></path>
                                        <path d="M3 18h4"></path>
                                        <path d="m14 16 3 3 3-3"></path>
                                        <path d="M17 7v12"></path>
                                        <path d="m14 10 3-3 3 3"></path>
                                    </svg>
                                </span>
                                <span>Ordenar</span>
                            </button>
                            <button type="button" id="btnDecklistBuilderSave" class="btn-primary decklist-builder-action-btn">
                                <span class="decklist-builder-btn-icon" aria-hidden="true">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                                        <path d="M17 21v-8H7v8"></path>
                                        <path d="M7 3v5h8"></path>
                                    </svg>
                                </span>
                                <span>Salvar</span>
                            </button>
                        </div>
                    </div>
                </div>
            </header>

            <div id="decklistToast" class="decklist-toast" aria-live="polite" aria-atomic="true"></div>

            <section class="decklist-builder-panel">
                <div class="decklist-builder-layout">
                    <div class="decklist-builder-stats-wrap">
                        <div id="decklistBuilderBreakdown" class="decklist-builder-breakdown" aria-live="polite"></div>
                    </div>

                    <div class="decklist-builder-actions">
                        <div id="decklistBuilderMeta" class="decklist-builder-meta" aria-live="polite"></div>
                        <div class="decklist-builder-zoom-hint">
                            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="hint-icon"><circle cx="8" cy="8" r="6"/><path d="M8 7v4"/><circle cx="8" cy="5" r="0.5" fill="currentColor" stroke="none"/></svg>
                            Clique com o botão direito para ver a carta &middot; Arraste para ordenar
                        </div>
                        <div id="decklistBuilderSaveStatus" class="decklist-builder-save-status" aria-live="polite"></div>
                    </div>

                    <div class="decklist-builder-main">
                        <div id="decklistBuilderErrors" class="decklist-builder-errors" role="status"></div>
                        <div id="decklistBuilderBoard" class="decklist-builder-board" aria-live="polite"></div>
                    </div>

                    <aside class="decklist-builder-side">
                        <section class="decklist-search-panel" aria-label="Card Search">
                            <div class="decklist-search-bar">
                                <input type="text" id="cardSearchText" class="form-input" placeholder="Buscar carta..." />
                                <button type="button" id="btnCardSearch" class="btn-primary btn-icon-only" aria-label="Search" title="Search">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                        <circle cx="11" cy="11" r="7"></circle>
                                        <path d="M21 21l-4.35-4.35"></path>
                                    </svg>
                                </button>
                                <div class="decklist-search-actions">
                                    <button type="button" id="btnCardSearchReset" class="btn-secondary clear-action" aria-label="Limpar busca" title="Limpar busca">
                                        Limpar
                                    </button>
                                </div>
                            </div>

                            <div class="decklist-search-filters">
                                
                                <div class="decklist-search-filter-line filter-full">
                                    <span class="filter-dot-label">Type:</span>
                                    <div class="filter-chip-group" id="cardSearchTypeGroup" role="group" aria-label="Card type">
                                        <button type="button" class="filter-chip is-active" data-value="">All</button>
                                        <button type="button" class="filter-chip" data-value="Digimon">Digimon</button>
                                        <button type="button" class="filter-chip" data-value="Digi-Egg">DigiEgg</button>
                                        <button type="button" class="filter-chip" data-value="Tamer">Tamer</button>
                                        <button type="button" class="filter-chip" data-value="Option">Option</button>
                                    </div>
                                </div>

                                <div class="filter-dot-group filter-full" id="cardSearchColorGroup" role="group" aria-label="Color 1">
                                    <span class="filter-dot-label">Color 1:</span>
                                    <button type="button" class="filter-color-all is-active" data-value="">Any</button>
                                    <button type="button" class="filter-dot" data-value="Red"    aria-label="Red"    title="Red"    style="background:#e53935;"></button>
                                    <button type="button" class="filter-dot" data-value="Blue"   aria-label="Blue"   title="Blue"   style="background:#1e88e5;"></button>
                                    <button type="button" class="filter-dot" data-value="Yellow" aria-label="Yellow" title="Yellow" style="background:#f9a825;"></button>
                                    <button type="button" class="filter-dot" data-value="Green"  aria-label="Green"  title="Green"  style="background:#43a047;"></button>
                                    <button type="button" class="filter-dot" data-value="White"  aria-label="White"  title="White"  style="background:#e8e8e8; border:2px solid #aaa;"></button>
                                    <button type="button" class="filter-dot" data-value="Black"  aria-label="Black"  title="Black"  style="background:#212121;"></button>
                                    <button type="button" class="filter-dot" data-value="Purple" aria-label="Purple" title="Purple" style="background:#7b1fa2;"></button>
                                </div>

                                <div class="filter-dot-group filter-full" id="cardSearchColor2Group" role="group" aria-label="Color 2">
                                    <span class="filter-dot-label">Color 2:</span>
                                    <button type="button" class="filter-color-all is-active" data-value="">Any</button>
                                    <button type="button" class="filter-dot" data-value="Red"    aria-label="Red"    title="Red"    style="background:#e53935;"></button>
                                    <button type="button" class="filter-dot" data-value="Blue"   aria-label="Blue"   title="Blue"   style="background:#1e88e5;"></button>
                                    <button type="button" class="filter-dot" data-value="Yellow" aria-label="Yellow" title="Yellow" style="background:#f9a825;"></button>
                                    <button type="button" class="filter-dot" data-value="Green"  aria-label="Green"  title="Green"  style="background:#43a047;"></button>
                                    <button type="button" class="filter-dot" data-value="White"  aria-label="White"  title="White"  style="background:#e8e8e8; border:2px solid #aaa;"></button>
                                    <button type="button" class="filter-dot" data-value="Black"  aria-label="Black"  title="Black"  style="background:#212121;"></button>
                                    <button type="button" class="filter-dot" data-value="Purple" aria-label="Purple" title="Purple" style="background:#7b1fa2;"></button>
                                </div>

                                <div class="decklist-search-filter-line filter-full">
                                    <span class="filter-dot-label">Level:</span>
                                    <div class="filter-chip-group" id="cardSearchLevelGroup" role="group" aria-label="Level">
                                        <button type="button" class="filter-chip is-active" data-value="">Lv: All</button>
                                        <button type="button" class="filter-chip" data-value="2">Lv 2</button>
                                        <button type="button" class="filter-chip" data-value="3">Lv 3</button>
                                        <button type="button" class="filter-chip" data-value="4">Lv 4</button>
                                        <button type="button" class="filter-chip" data-value="5">Lv 5</button>
                                        <button type="button" class="filter-chip" data-value="6">Lv 6</button>
                                        <button type="button" class="filter-chip" data-value="7">Lv 7</button>
                                    </div>
                                </div>
                                    
                                <input
                                    type="number"
                                    id="cardSearchPlayCost"
                                    class="form-input"
                                    placeholder="Cost (0-20)"
                                    min="0"
                                    max="20"
                                    step="1"
                                />
                                <input type="text" id="cardSearchCode" class="form-input" placeholder="Set (ex: BT1)" list="cardSearchCodeList" autocomplete="off" />
                                <datalist id="cardSearchCodeList"></datalist>
                            </div>
                            <div id="cardSearchResults" class="decklist-search-results" aria-live="polite"></div>
                        </section>
                    </aside>
                </div>
            </section>
        </div>

        <div id="decklistImportModal" class="decklist-import-modal" aria-hidden="true">
            <div class="decklist-import-dialog" role="dialog" aria-modal="true" aria-labelledby="decklistImportTitle">
                <div class="decklist-import-header">
                    <h2 id="decklistImportTitle">Importar deck</h2>
                    <button type="button" id="btnDecklistImportClose" class="decklist-import-close cancel-close" aria-label="Cancelar">Cancelar</button>
                </div>
                <div class="decklist-import-body">
                    <label for="decklistImportTextarea">Cole a decklist</label>
                    <textarea
                        id="decklistImportTextarea"
                        rows="12"
                        placeholder="// Digimon Deck List&#10;4 Koromon ST1-01&#10;4 Biyomon ST1-02&#10;4 Agumon ST1-03"
                    ></textarea>
                </div>
                <div class="decklist-import-footer">
                    <button type="button" id="btnDecklistImportCancel" class="btn-secondary">Cancelar</button>
                    <button type="button" id="btnDecklistImportConfirm" class="btn-primary">Importar</button>
                </div>
            </div>
        </div>

        <div id="decklistClearModal" class="decklist-import-modal" aria-hidden="true">
            <div class="decklist-import-dialog" role="dialog" aria-modal="true" aria-labelledby="decklistClearTitle">
                <div class="decklist-import-header">
                    <h2 id="decklistClearTitle">Limpar decklist</h2>
                    <button type="button" id="btnDecklistClearClose" class="decklist-import-close cancel-close" aria-label="Cancelar">Cancelar</button>
                </div>
                <div class="decklist-import-body">
                    <p>Deseja remover todas as cartas desta decklist?</p>
                </div>
                <div class="decklist-import-footer">
                    <button type="button" id="btnDecklistClearCancel" class="btn-secondary">Cancelar</button>
                    <button type="button" id="btnDecklistClearConfirm" class="btn-danger">Limpar decklist</button>
                </div>
            </div>
        </div>

        <div id="decklistSaveWarningModal" class="decklist-import-modal" aria-hidden="true">
            <div class="decklist-import-dialog" role="dialog" aria-modal="true" aria-labelledby="decklistSaveWarningTitle">
                <div class="decklist-import-header">
                    <h2 id="decklistSaveWarningTitle">Deck incompleto</h2>
                    <button type="button" id="btnDecklistSaveWarningClose" class="decklist-import-close cancel-close" aria-label="Cancelar">Cancelar</button>
                </div>
                <div class="decklist-import-body">
                    <p id="decklistSaveWarningMsg"></p>
                </div>
                <div class="decklist-import-footer">
                    <button type="button" id="btnDecklistSaveWarningCancel" class="btn-secondary">Cancelar</button>
                    <button type="button" id="btnDecklistSaveWarningConfirm" class="btn-primary">Salvar mesmo assim</button>
                </div>
            </div>
        </div>

        <div id="deckCardZoomModal" class="deck-card-zoom-modal" aria-hidden="true">
            <div class="deck-card-zoom-dialog" role="dialog" aria-modal="true" aria-label="Card zoom preview">
                <button type="button" id="btnDeckCardZoomClose" class="deck-card-zoom-close cancel-close" aria-label="Cancelar">Cancelar</button>
                <div class="deck-card-zoom-content">
                    <div id="deckCardZoomImageWrap" class="deck-card-zoom-image-wrap">
                        <img id="deckCardZoomImage" src="" alt="Card preview" />
                    </div>
                    <div class="deck-card-zoom-meta">
                        <div id="deckCardZoomMetaTitle" class="deck-card-zoom-meta-title">Loading...</div>
                        <div id="deckCardZoomMetaBody" class="deck-card-zoom-meta-body"></div>
                    </div>
                </div>
            </div>
        </div>

        <script src="../../config/supabase.js?v=2026.03.27.1"></script>
        <script src="../../config/app-version.js?v=2026.07.26.1"></script>
        <script src="script.js?v=2026.07.26.1"></script>
        <script src="../../config/register-sw.js?v=2026.03.27.1"></script>
    </body>
</html>
